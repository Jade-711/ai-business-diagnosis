<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能助手 · 隔离评测</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:1060px;margin:32px auto;padding:0 24px;background:#f5f7f6;color:#1d3731}section{background:white;border:1px solid #d7e1dc;border-radius:12px;padding:24px;margin:20px 0}h1{font-size:28px}label{display:block;margin:14px 0}textarea{box-sizing:border-box;width:100%;min-height:150px;font:13px ui-monospace,monospace;padding:12px}input{padding:10px;width:340px}button{font-size:16px;padding:11px 18px;border:0;border-radius:8px;background:#176b53;color:white;margin:6px 12px 6px 0;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;line-height:1.65}small{color:#52695e}#status{font-weight:600}a{color:#176b53}</style>
<h1>智能助手 · 隔离评测</h1><p>使用独立模拟快照，逐条运行并保留实际结果。此入口仅供项目授权评测使用。</p>
<section><label>本轮访问凭据（已登录项目授权账号时可留空）<br><input id="key" type="password" autocomplete="off"></label><label>本批测试请求<textarea id="requests" placeholder="粘贴已暂存的测试请求数组"></textarea></label><button id="run">运行当前批次</button><button id="stop" disabled>停止</button><p id="status" role="status">等待测试请求</p><small>每条计时从开始提交至完整结果渲染后；不会把排队等待计入该条耗时。</small></section>
<section><h2>当前完整回答</h2><pre id="answer">尚未运行</pre></section>
<section><h2>实际结果记录</h2><button id="copy">复制实际结果</button><button id="download">下载实际结果</button><textarea id="results" readonly></textarea></section>
<script src="/coze-client.js"></script><script src="/evaluation.js"></script></html>
